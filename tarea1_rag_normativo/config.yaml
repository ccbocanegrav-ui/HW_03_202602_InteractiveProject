# config.yaml — Tarea 1 (RAG Normativo)
# Todo parámetro que afecte el comportamiento del pipeline vive aquí,
# nunca hardcodeado en el código (requisito explícito del enunciado).

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  logs_dir: "logs"
  eval_dir: "eval"
  index_dir: "data/index"          # persistencia de ChromaDB

documents:
  - id: ley_32069
    filename: ley_32069.pdf
    fuente: "https://www.gob.pe/institucion/osce/colecciones/45029-ley-n-32069-ley-general-de-contrataciones-publicas"
  - id: ds_001_2026_ef
    filename: ds_001_2026_ef.pdf
    fuente: "https://busquedas.elperuano.pe/dispositivo/NL/2474920-3"

chunking:
  target_size_chars: 300
  overlap_ratio: 0.2
  min_chunk_ratio: 0.3             # fusiona el ultimo chunk de pagina si es menor a este % del tamaño objetivo

embeddings:
  local:
    provider: "sentence-transformers"
    model_name: "intfloat/multilingual-e5-base"
    # e5 requiere prefijos distintos para query vs. passage (documentado
    # en su model card): sin el prefijo correcto, la similitud se degrada.
    query_prefix: "query: "
    passage_prefix: "passage: "
    max_input_tokens: 512
  api:
    # SUSTITUCION DOCUMENTADA (Fase 4): el enunciado pide comparar
    # contra text-embedding-3-small de OpenAI, pero esto requiere
    # creditos de pago no disponibles. Se intento primero con
    # text-embedding-004 de Gemini, pero su endpoint de embeddings
    # tiene un bug confirmado del lado de Google con las API keys
    # nuevas (401 ACCESS_TOKEN_TYPE_UNSUPPORTED, ver DECISIONES.md).
    # Se usa Cohere (embed-multilingual-v3.0) en su lugar: nivel
    # gratuito real, sin tarjeta, sin el problema de Gemini.
    provider: "cohere"
    model_name: "embed-multilingual-v3.0"
    max_input_tokens: 512

vector_store:
  provider: "chromadb"
  collection_name: "procurement_normativo"

retrieval:
  top_k: 5
  similarity_threshold: 0.70        # CALIBRADO con evidencia (logs/threshold_sweep.csv, Fase 3):
                                     # 8/10 decisiones correctas en el set preliminar (eval/preguntas.csv).
                                     # Ningun threshold logra separacion perfecta: hay preguntas
                                     # "cercanas al dominio pero no contestables" (ej. detalle que
                                     # solo el Reglamento completo tiene) que quedan por encima de
                                     # cualquier threshold razonable. Mitigacion: el prompt del
                                     # generador (ver "generation" abajo) es la SEGUNDA linea de
                                     # defensa -- aun si retrieval deja pasar un caso limite, el
                                     # LLM esta instruido a decir que no puede responder si el
                                     # contexto no lo sustenta, en vez de alucinar.

generation:
  provider: "cohere"                 # cambiar aqui, no en el codigo. "cohere" (gratis, estable) / "gemini" / "openai" (de pago)
  model_name: "command-r-08-2024"    # "command-r" (alias viejo) fue retirado el 15/09/2025 por Cohere; verificado vigente en docs.cohere.com/docs/models el 2026-09-24
  max_output_tokens: 1024            # gemini-3.6-flash consume tokens internos de "thinking" antes
                                      # de la respuesta final; 500 no alcanzaba y cortaba la respuesta a la mitad
  system_prompt: |
    Eres un asistente que responde preguntas sobre contrataciones
    publicas del Peru usando UNICAMENTE el contexto proporcionado.
    Si la respuesta no esta en el contexto, indica explicitamente que
    no puedes responder con la informacion disponible.

    FORMATO OBLIGATORIO: al final de CADA afirmacion, cita la fuente
    exacta entre parentesis asi: (Ley 32069, pag. 29) o
    (DS 001-2026-EF, pag. 6). Nunca respondas sin esta cita. Si tu
    respuesta usa informacion de mas de una fuente, cita cada
    afirmacion con su fuente correspondiente por separado.

    Se conciso: responde en 2-4 oraciones como maximo, salvo que la
    pregunta pida explicitamente una lista o un detalle mas extenso.

costs:
  log_file: "logs/cost_log.csv"
